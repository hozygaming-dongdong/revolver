<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15100d">
  <meta name="description" content="左輪追獵：每一槍選擇穩健彈藥或獎金 UP，撐到第八回合抽出最高 10X。">
  <title>REVOLVER · 左輪追獵</title>
  <link rel="stylesheet" href="style.css?v=demo-1">
  <script defer src="rules.js?v=demo-1"></script>
  <script defer src="game.js?v=demo-1"></script>
</head>
<body>
  <main class="game" id="game" data-mode="ready">
    <header class="hud">
      <div class="brand"><span>REVOLVER</span><small>左輪追獵 DEMO</small></div>
      <div class="hud-stats">
        <div><span>回合</span><strong id="round-number">—</strong></div>
        <div><span>彈藥</span><strong id="ammo">6 / 6</strong></div>
        <div><span>UP</span><strong id="up">0 層</strong></div>
      </div>
      <div class="jackpot" id="jackpot">WIN UP TO 10X</div>
      <ol class="progress" id="progress" aria-label="八回合進度"></ol>
    </header>

    <section class="arena" id="arena">
      <div class="gate-number" aria-hidden="true">08</div>
      <section class="intro" id="intro">
        <img src="assets/boss.webp" alt="" class="hero-art">
        <p class="eyebrow">每一槍都是選擇</p>
        <h1>追到第八回合<br>抽一次最高 10X</h1>
        <p id="goal">一路撐到第 8 回合，最後抽一次獎金倍率。</p>
        <div class="rule-strip"><span>實彈：目標死亡</span><span>空炮：玩家死亡</span></div>
        <button class="primary" id="start" type="button">開始追獵</button>
      </section>

      <section class="play" id="play" hidden>
        <div class="stage-copy">
          <p class="eyebrow" id="round-title">進入封鎖區</p>
          <h1 id="play-goal">目標：完成開槍選擇。</h1>
          <p class="shot-rule">選一隻殭屍，開槍結束本回合。</p>
        </div>
        <div class="target-zone" id="target">
          <button class="target-card ammo-target" id="choice-ammo" type="button">
            <span class="target-image"><img src="assets/zombie.webp" alt="補彈殭屍"></span>
            <strong>補彈殭屍</strong>
            <small id="ammo-value">抽 +0 / +1 / +2</small>
            <em>穩健子彈</em>
          </button>
          <button class="target-card bonus-target" id="choice-bonus" type="button">
            <span class="target-image"><img src="assets/boss.webp" alt="獎金殭屍"></span>
            <strong>獎金殭屍</strong>
            <small id="bonus-value">成功累積 1 層 UP</small>
            <em>拚大獎</em>
          </button>
        </div>
      </section>

      <section class="result" id="result" hidden>
        <img src="assets/final-cache.webp" alt="" class="result-art" loading="lazy">
        <p class="eyebrow" id="result-title">本局結束</p>
        <h1 id="result-message"></h1>
        <strong class="payout" id="result-payout">$0</strong>
        <p id="result-detail"></p>
        <button class="primary" id="restart" type="button">再玩一輪</button>
      </section>

      <div class="console" id="fire-panel">
        <p class="hint" id="hint" role="status"></p>
      </div>
    </section>
  </main>
</body>
</html>
