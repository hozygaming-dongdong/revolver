<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120b08">
  <meta name="description" content="REVOLVER 左輪追獵：選目標、轉彈巢、一路拚到最高 10X。">
  <title>REVOLVER · 左輪追獵</title>
  <link rel="preload" as="image" href="assets/corridor.webp" fetchpriority="high">
  <link rel="stylesheet" href="style.css?v=demo-3">
  <script defer src="rules.js?v=demo-2"></script>
  <script defer src="audio.js?v=demo-2"></script>
  <script defer src="game.js?v=demo-2"></script>
</head>
<body>
  <main class="game" id="game" data-mode="ready">
    <header class="hud">
      <div class="brand"><span>REVOLVER</span><small>左輪追獵</small></div>
      <div class="hud-stats">
        <div><span>回合</span><strong id="round-number">—</strong></div>
        <div class="ammo-meter"><img src="assets/cartridge.png" alt=""><strong id="ammo">6</strong><small>/ 6</small></div>
        <div class="up-meter"><img src="assets/coin.png" alt=""><strong id="up">0</strong><small>UP</small></div>
      </div>
      <div class="jackpot"><span>FINAL PRIZE</span><strong>WIN UP TO 10X</strong></div>
      <ol class="progress" id="progress" aria-label="八回合追獵進度"></ol>
    </header>

    <section class="arena" id="arena">
      <div class="backdrop-number" aria-hidden="true">08</div>
      <div class="route" id="route" aria-label="追獵路線">
        <span class="route-label">追獵目標</span>
        <div class="route-line"><i id="route-dot"></i></div>
        <strong id="route-title">進入封鎖區</strong>
      </div>

      <section class="intro" id="intro">
        <img src="assets/boss.webp" alt="" class="intro-boss">
        <div class="intro-prize"><span>WIN UP TO</span><strong>10X</strong></div>
        <h1>每一槍<br>都離獎金更近</h1>
        <div class="intro-icons"><span><img src="assets/ammo-cache.webp" alt="">補彈</span><span><img src="assets/bounty-token.webp" alt="">UP</span><span><img src="assets/final-cache.webp" alt="">終點</span></div>
        <button class="primary" id="start" type="button">開始追獵</button>
      </section>

      <section class="hunt" id="hunt" hidden>
        <div class="hunt-heading"><span class="eyebrow">選擇追獵目標</span><strong>開槍擊殺，換取你的路線獎勵</strong></div>
        <div class="enemy-stage" id="enemy-stage">
          <div class="choice-row" id="choice-row">
            <button class="choice-card ammo-choice" id="choice-ammo" type="button">
              <span class="door-label"><img src="assets/ammo-cache.webp" alt=""><b>補彈門</b></span>
              <span class="door-scene"><span class="door-glow"></span><img src="assets/boss-runner.webp" alt="補彈殭屍"><i class="door-crosshair" aria-hidden="true"></i></span>
              <span class="choice-name">彈藥殭屍</span>
              <small>擊殺後轉輪抽 +0 / +1 / +2</small>
            </button>
            <button class="choice-card bonus-choice" id="choice-bonus" type="button">
              <span class="door-label"><img src="assets/bounty-token.webp" alt=""><b>獎金門</b></span>
              <span class="door-scene"><span class="door-glow"></span><img src="assets/boss-armored.webp" alt="獎金殭屍"><i class="door-crosshair" aria-hidden="true"></i></span>
              <span class="choice-name">獎金殭屍</span>
              <small>擊殺後累積一層 UP</small>
            </button>
          </div>
          <div class="hit-flash" id="hit-flash"></div>
        </div>
      </section>

      <section class="result" id="result" hidden>
        <img src="assets/final-cache.webp" alt="" class="result-cache" loading="lazy">
        <p class="eyebrow" id="result-kicker">任務結束</p>
        <h1 id="result-title"></h1>
        <strong class="result-payout" id="result-payout">$0</strong>
        <p id="result-detail"></p>
        <button class="primary" id="restart" type="button">再玩一輪</button>
      </section>

      <section class="weapon-panel" id="weapon-panel" hidden>
        <div class="weapon-label"><span>彈巢</span><strong id="shot-state">選擇目標</strong></div>
        <div class="weapon" id="weapon">
          <span class="cylinder-pointer" aria-hidden="true"></span>
          <div class="cylinder" id="cylinder" aria-label="六格彈巢"></div>
        </div>
        <button class="fire-button" id="fire" type="button" disabled><span>FIRE</span><small>選目標後開槍</small></button>
      </section>

      <div class="hint" id="hint" role="status"></div>

      <section class="loot-overlay" id="loot" aria-live="polite" hidden>
        <div class="loot-panel">
          <p class="eyebrow" id="loot-kicker">獎勵抽選</p>
          <h2 id="loot-title">彈藥</h2>
          <div class="loot-wheel" id="loot-wheel">
            <span class="wheel-pointer" aria-hidden="true"></span>
            <div class="loot-disc" id="loot-disc"></div>
            <div class="wheel-core"><img id="loot-core" src="assets/cartridge.png" alt=""></div>
          </div>
          <strong class="loot-result" id="loot-result"></strong>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
