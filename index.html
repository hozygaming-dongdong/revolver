<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0e">
  <title>REVOLVER · 封鎖區</title>
  <link rel="preload" as="image" href="assets/demo-doors.webp">
  <link rel="stylesheet" href="style.css?v=showdown-1">
  <script defer src="rules.js?v=showdown-1"></script>
  <script defer src="audio.js"></script>
  <script defer src="game.js?v=showdown-1"></script>
</head>
<body>
  <main id="app" data-phase="ready" data-scene="doors">
    <div class="backdrop" aria-hidden="true"></div>
    <header class="hud">
      <div class="masthead">
        <div>REVOLVER <span>封鎖區</span></div>
        <button id="sound" class="sound" type="button" aria-label="音效" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM16 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg>
        </button>
      </div>
      <div class="cashline">
        <div class="stat"><span>CREDITS · 餘額</span><strong id="credits">1,000</strong></div>
        <div class="stat"><span>BET · 押分</span><strong id="bet">10</strong></div>
        <div class="stat jackpot"><span>WIN UP TO</span><strong>10<span>X</span></strong></div>
      </div>
      <div class="runline">
        <div><span id="round-label">備戰</span><strong id="round">—</strong></div>
        <div><span>彈巢</span><strong id="ammo">6/6</strong></div>
        <div><span>賞金加成</span><strong id="bonus">×1.0</strong></div>
        <div><span>最高派彩</span><strong id="ceiling">100</strong></div>
      </div>
      <div class="route" id="route" aria-label="備戰進度"><i></i><i></i><i></i><i></i><i></i><i class="boss-node"></i></div>
    </header>

    <section class="stage" aria-label="遊戲場景">
      <div id="ready" class="ready">
        <div class="hero"><span>封鎖區</span><h1>REVOLVER</h1><p>穿越五道門，擊倒 Boss 抽最終獎金</p></div>
      </div>
      <div id="doors" class="doors" hidden>
        <h2>選一扇門</h2>
        <div class="door-options">
          <button class="door" type="button"><img alt=""><strong></strong><small></small></button>
          <button class="door" type="button"><img alt=""><strong></strong><small></small></button>
        </div>
      </div>
      <img id="enemy" class="enemy" alt="" hidden>
      <div id="target" class="target" hidden><img id="target-icon" alt=""><div><strong id="target-name"></strong><small id="target-reward"></small></div></div>
      <div id="boss-status" class="boss-status" hidden>
        <div><span>BOSS</span><strong id="boss-hp">◆ ◆ ◆</strong></div>
        <div><span>反擊倒數</span><strong id="boss-clock">3 槍</strong></div>
      </div>
      <div class="reticle" aria-hidden="true"></div>
      <img class="weapon" src="assets/demo-weapon.webp" alt="">
      <div class="flash" aria-hidden="true"></div>
      <div id="combat" class="combat" hidden>
        <div id="armory" class="armory" hidden>
          <div class="armory-head"><span id="load-guide">裝填特殊彈</span><button type="button" id="undo" data-action="undo" hidden>復原</button></div>
          <div class="pocket">
            <button type="button" data-load="normal" class="normal"><img src="assets/cartridge.png" alt=""><span>普通</span><b></b></button>
            <button type="button" data-load="crit" class="crit"><img src="assets/cartridge.png" alt=""><span>爆擊</span><b></b></button>
            <button type="button" data-load="freeze" class="freeze"><img src="assets/cartridge.png" alt=""><span>冰凍</span><b></b></button>
            <button type="button" data-load="bounty" class="bounty"><img src="assets/cartridge.png" alt=""><span>賞金</span><b></b></button>
          </div>
        </div>
        <div class="action-row">
          <div class="cylinder-frame" aria-label="六格彈巢">
            <i class="pointer"></i>
            <div id="cylinder" class="cylinder"></div>
          </div>
          <div class="trigger">
            <div id="shot" class="shot" role="status"></div>
            <button id="fire" class="cta fire" type="button" data-action="fire"><span>FIRE</span><small>轉彈巢 · 開槍</small></button>
          </div>
        </div>
      </div>
      <div id="reward" class="reward" hidden>
        <h2 id="reward-title"></h2>
        <div class="wheel-frame">
          <i class="pointer"></i>
          <div id="wheel" class="wheel"></div>
          <div class="hub"><img id="wheel-icon" alt=""></div>
        </div>
        <strong id="reward-result" role="status"></strong>
        <small id="reward-detail"></small>
      </div>
      <div id="result" class="result" hidden>
        <img id="result-icon" src="assets/bounty-token.webp" alt="">
        <h2 id="result-title"></h2>
        <strong id="payout"></strong>
        <p id="result-detail"></p>
      </div>
    </section>

    <footer class="dock">
      <div id="wager" class="wager">
        <button type="button" class="bet-step" data-action="lower" aria-label="降低押分">−</button>
        <button type="button" class="bet-step" data-action="higher" aria-label="提高押分">+</button>
        <button type="button" class="cta" id="start" data-action="start">押分開局</button>
      </div>
      <button type="button" id="advance" class="cta" data-action="advance" hidden>轉動輪盤</button>
      <span id="footer-status" role="status">試玩點數</span>
    </footer>
  </main>
</body>
</html>
